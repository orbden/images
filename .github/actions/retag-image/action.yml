name: Re-tag upstream image
description: Copies an upstream multi-arch image to ghcr.io under the tags computed by docker/metadata-action.
# Runs inside the caller's job, so the job needs `packages: write` from the
# workflow that uses it. The registry login uses the job's own GITHUB_TOKEN.

inputs:
  image:
    description: Target image name without registry, e.g. mariadb
    required: true
  tags:
    description: docker/metadata-action `tags` input (type=raw lines)
    required: true
  source:
    description: Upstream reference to copy, name:tag@digest
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        flavor: latest=false
        tags: ${{ inputs.tags }}

    - name: Re-tag upstream image
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          "$SOURCE"
