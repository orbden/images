name: Scan image
description: Trivy scan of a pushed image, uploaded as SARIF code-scanning results.
# Runs inside the caller's job, so the job needs `security-events: write`
# (and `contents: read`) from the workflow that uses it.

inputs:
  image-ref:
    description: Fully qualified image reference to scan
    required: true
  name:
    description: Short name used for the SARIF file and the code-scanning category (trivy-<name>)
    required: true

runs:
  using: composite
  steps:
    - uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: sarif
        output: trivy-${{ inputs.name }}.sarif
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-${{ inputs.name }}.sarif
        category: trivy-${{ inputs.name }}
