name: Build & Push Images

on:
  push:
    branches: [main]
    # Only files that go into a built image (the frankenphp build context's
    # COPY sources) plus versions.json. Compose files, READMEs, Dockerfile.dev,
    # the stack/ files and the bind-mounted configs of the re-tagged images do
    # not change an image, so they must not rebuild or move any tag. Per-image
    # filtering inside versions.json is done by the "Detect changed images" step.
    paths:
      - "frankenphp/Dockerfile"
      - "frankenphp/.dockerignore"
      - "frankenphp/Caddyfile"
      - "frankenphp/php.ini"
      - "frankenphp/caddy-global/**"
      - "frankenphp/docker-entrypoint.d/**"
      - "frankenphp/docker-entrypoint.sh"
      - "frankenphp/wcp-wp"
      - "versions.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      frankenphp: ${{ steps.v.outputs.frankenphp }}
      frankenphp_base: ${{ steps.v.outputs.frankenphp_base }}
      frankenphp_php_versions: ${{ steps.v.outputs.frankenphp_php_versions }}
      frankenphp_php_default: ${{ steps.v.outputs.frankenphp_php_default }}
      mariadb_runtimes: ${{ steps.v.outputs.mariadb_runtimes }}
      mariadb_default: ${{ steps.v.outputs.mariadb_default }}
      valkey: ${{ steps.v.outputs.valkey }}
      valkey_digest: ${{ steps.v.outputs.valkey_digest }}
      postgres: ${{ steps.v.outputs.postgres }}
      postgres_digest: ${{ steps.v.outputs.postgres_digest }}
      meilisearch: ${{ steps.v.outputs.meilisearch }}
      meilisearch_digest: ${{ steps.v.outputs.meilisearch_digest }}
      frankenphp_changed: ${{ steps.changes.outputs.frankenphp }}
      mariadb_changed: ${{ steps.changes.outputs.mariadb }}
      valkey_changed: ${{ steps.changes.outputs.valkey }}
      postgres_changed: ${{ steps.changes.outputs.postgres }}
      meilisearch_changed: ${{ steps.changes.outputs.meilisearch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read versions.json
        id: v
        run: |
          echo "frankenphp=$(jq -r '.images.frankenphp.version' versions.json)" >> $GITHUB_OUTPUT
          echo "frankenphp_base=$(jq -r '.images.frankenphp.baseVersion // .images.frankenphp.version' versions.json)" >> $GITHUB_OUTPUT
          echo "frankenphp_php_versions=$(jq -c '.images.frankenphp.phpVersions' versions.json)" >> $GITHUB_OUTPUT
          # No static `phpDefault` field - the recommended PHP version is
          # computed as the middle of the "supported" runtimes by version,
          # same rule as src-tauri/src/image_catalog.rs's
          # default_runtime_tuple/src/shared/image-catalog.ts's
          # defaultRuntime, so the `:latest` tag below tracks whichever
          # version the app itself would actually recommend.
          echo "frankenphp_php_default=$(jq -r '
            [.images.frankenphp.runtimes[] | select(.supportStatus == "supported")]
            | sort_by(.phpVersion | split(".") | map(tonumber))
            | .[(length - 1) / 2 | floor]
            | .phpVersion
          ' versions.json)" >> $GITHUB_OUTPUT
          # mariadb is `runtimes[]` (one or more coexisting major lines, see
          # image_catalog.rs) rather than a single version - the default
          # line is whichever "supported" entry comes first, matching
          # default_mariadb_runtime_id's array-order rule (DB majors aren't
          # interchangeable like PHP versions, so this is curated order, not
          # a computed middle).
          echo "mariadb_runtimes=$(jq -c '.images.mariadb.runtimes' versions.json)" >> $GITHUB_OUTPUT
          echo "mariadb_default=$(jq -r '[.images.mariadb.runtimes[] | select(.supportStatus == "supported")] | .[0].id' versions.json)" >> $GITHUB_OUTPUT
          echo "valkey=$(jq -r '.images.valkey.version' versions.json)" >> $GITHUB_OUTPUT
          echo "valkey_digest=$(jq -r '.images.valkey.digest' versions.json)" >> $GITHUB_OUTPUT
          echo "postgres=$(jq -r '.images.postgres.version' versions.json)" >> $GITHUB_OUTPUT
          echo "postgres_digest=$(jq -r '.images.postgres.digest' versions.json)" >> $GITHUB_OUTPUT
          echo "meilisearch=$(jq -r '.images.meilisearch.version' versions.json)" >> $GITHUB_OUTPUT
          echo "meilisearch_digest=$(jq -r '.images.meilisearch.digest' versions.json)" >> $GITHUB_OUTPUT

      # Per-image change detection: an image is "changed" if a file that goes
      # into it changed (frankenphp's COPY sources; the other images are
      # upstream re-tags with no files baked in), or its versions.json entry
      # differs from the previous commit (frankenphp: ignoring the recorded
      # digests, which are outputs of a build, not inputs). workflow_dispatch ignores these outputs
      # entirely (see per-job `if:` below) and always builds everything.
      - name: Detect changed images
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] \
             && [ -n "$BASE_SHA" ] \
             && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            BASE="$BASE_SHA"
          else
            BASE=""
          fi

          # Files that go into each image. Only frankenphp builds from a
          # context; mariadb/valkey/postgres/meilisearch re-tag an upstream
          # image and their directories only hold compose files and
          # bind-mounted configs, so they have no build inputs here.
          inputs() {
            case "$1" in
              frankenphp)
                echo frankenphp/Dockerfile frankenphp/.dockerignore \
                  frankenphp/Caddyfile frankenphp/php.ini frankenphp/caddy-global \
                  frankenphp/docker-entrypoint.d frankenphp/docker-entrypoint.sh \
                  frankenphp/wcp-wp
                ;;
            esac
          }

          changed() {
            key="$1"
            if [ -z "$BASE" ]; then
              echo true
              return
            fi
            files=$(inputs "$key")
            if [ -n "$files" ] && ! git diff --quiet "$BASE" HEAD -- $files; then
              echo true
              return
            fi
            filter=".images.$key"
            if [ "$key" = "frankenphp" ]; then
              filter="$filter | .runtimes |= map(del(.digest, .platformDigests))"
            fi
            old=$(git show "$BASE:versions.json" 2>/dev/null | jq -c "$filter" 2>/dev/null)
            new=$(jq -c "$filter" versions.json)
            if [ "$old" != "$new" ]; then
              echo true
            else
              echo false
            fi
          }

          echo "frankenphp=$(changed frankenphp)" >> "$GITHUB_OUTPUT"
          echo "mariadb=$(changed mariadb)" >> "$GITHUB_OUTPUT"
          echo "valkey=$(changed valkey)" >> "$GITHUB_OUTPUT"
          echo "postgres=$(changed postgres)" >> "$GITHUB_OUTPUT"
          echo "meilisearch=$(changed meilisearch)" >> "$GITHUB_OUTPUT"

  # Built natively per-platform (no QEMU) and merged into one manifest below,
  # since arm64 under QEMU emulation is 5-10x slower for compiling PHP
  # extensions than running on a real arm64 runner.
  frankenphp-build:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.frankenphp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.versions.outputs.frankenphp_php_versions) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM/\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./frankenphp
          platforms: ${{ matrix.platform }}
          build-args: |
            FRANKENPHP_VERSION=${{ needs.versions.outputs.frankenphp_base }}
            PHP_VERSION=${{ matrix.php }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/frankenphp,push-by-digest=true,name-canonical=true,push=true
          # gha cache is fast but evicted after 7 days / 10GB; the registry
          # cache is slower but persists across the long gaps between
          # FrankenPHP/PHP version bumps. Scoped per php+platform (not one
          # shared buildcache tag) since matrix legs push concurrently and
          # would otherwise clobber each other's cache.
          cache-from: |
            type=gha,scope=frankenphp-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/frankenphp:buildcache-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
          cache-to: |
            type=gha,mode=max,scope=frankenphp-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/frankenphp:buildcache-${{ matrix.php }}-${{ env.PLATFORM_SLUG }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  frankenphp-merge:
    needs: [versions, frankenphp-build]
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.frankenphp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.versions.outputs.frankenphp_php_versions) }}
    runs-on: ubuntu-latest
    steps:
      # The local composite actions below live in this repository.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.php }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/frankenphp
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.versions.outputs.frankenphp }}-php${{ matrix.php }}
            type=raw,value=${{ needs.versions.outputs.frankenphp_base }}-php${{ matrix.php }}
            type=raw,value=latest,enable=${{ matrix.php == needs.versions.outputs.frankenphp_php_default }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/frankenphp@sha256:%s ' *)

      - uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/frankenphp:${{ needs.versions.outputs.frankenphp }}-php${{ matrix.php }}
          name: frankenphp-php${{ matrix.php }}

  # One job per coexisting MariaDB major line (images/versions.json's
  # images.mariadb.runtimes) rather than a single version - each line keeps
  # its own tag/digest so promoting a new major never retags or replaces an
  # existing one (see the note on images.mariadb in versions.json and
  # image_catalog.rs's DbRuntimeTuple).
  #
  # The re-tag jobs below use no custom Dockerfile: config is delivered via
  # bind mount at runtime (see <image>/docker-compose.yml), so the upstream
  # multi-arch image is re-tagged under our fixed ghcr.io tag instead of
  # rebuilt (meilisearch only needs its healthcheck, which lives in compose).
  mariadb:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.mariadb_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJson(needs.versions.outputs.mariadb_runtimes) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/retag-image
        with:
          image: mariadb
          tags: |
            type=raw,value=${{ matrix.runtime.version }}
            type=raw,value=latest,enable=${{ matrix.runtime.id == needs.versions.outputs.mariadb_default }}
          source: mariadb:${{ matrix.runtime.version }}@${{ matrix.runtime.digest }}

      - uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mariadb:${{ matrix.runtime.version }}
          name: mariadb-${{ matrix.runtime.id }}

  valkey:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.valkey_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/retag-image
        with:
          image: valkey
          tags: |
            type=raw,value=${{ needs.versions.outputs.valkey }}
            type=raw,value=latest
          source: valkey/valkey:${{ needs.versions.outputs.valkey }}-alpine@${{ needs.versions.outputs.valkey_digest }}

      - uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/valkey:${{ needs.versions.outputs.valkey }}
          name: valkey

  postgres:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.postgres_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/retag-image
        with:
          image: postgres
          tags: |
            type=raw,value=${{ needs.versions.outputs.postgres }}
            type=raw,value=latest
          source: postgres:${{ needs.versions.outputs.postgres }}-alpine@${{ needs.versions.outputs.postgres_digest }}

      - uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/postgres:${{ needs.versions.outputs.postgres }}
          name: postgres

  meilisearch:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.meilisearch_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/retag-image
        with:
          image: meilisearch
          tags: |
            type=raw,value=${{ needs.versions.outputs.meilisearch }}
            type=raw,value=latest
          source: getmeili/meilisearch:v${{ needs.versions.outputs.meilisearch }}@${{ needs.versions.outputs.meilisearch_digest }}

      - uses: ./.github/actions/scan-image
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/meilisearch:${{ needs.versions.outputs.meilisearch }}
          name: meilisearch
